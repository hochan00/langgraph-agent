[project]
name = "langgraph-agent"
version = "0.1.0"
description = "GitHub 커밋과 diff를 근거로 하루 개발 작업을 정리해 Obsidian 데일리 노트로 남기는 LLM 에이전트"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.1",
    "langchain>=1.3.11",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.5",
    "langgraph>=1.2.6",
    "langsmith>=0.9.1",
    "pydantic-settings>=2.14.2",
    "pygithub>=2.5.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
