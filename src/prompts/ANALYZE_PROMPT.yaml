instruction: |
  지금까지 확인한 커밋 목록과 diff를 바탕으로, 레포별로 이날 한 작업을 분석해 주세요.

  - repo: 커밋 목록에 적힌 레포 이름(owner/repo)을 그대로 쓰세요. 목록에 있는 레포는 빠짐없이 포함하세요.
  - summary: 그 레포에서 무엇을 왜 바꿨는지 서술하세요. diff를 확인한 커밋은 파일·함수·로직 등 구체적인 근거를
    담고, 메시지만 본 커밋은 메시지에 적힌 내용까지만 쓰세요. 확인하지 않은 내용을 추측해서 채우지 마세요.
  - key_changes: 실제로 있었던 주요 변경사항을 짧은 항목으로 나열하세요.

  커밋 SHA나 커밋 목록은 쓰지 마세요. 커밋 목록은 수집 결과로 별도로 붙습니다.
